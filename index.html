<!--

<div id="elena-dentist-mobile" lang="ru">
  <style>
    #elena-dentist-mobile {
      --ink: #0e2831;
      --ink-soft: #45636c;
      --mint-900: #0b6e71;
      --mint-700: #168c8a;
      --mint-400: #9fe5db;
      --mint-100: #e4f8f3;
      --aqua: #25b9c0;
      --peach: #ffb08b;
      --sun: #ffd36e;
      --paper: #f5fcfa;
      --line: #c9e8e1;
      --white: #ffffff;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: clip;
    }

    #elena-dentist-mobile * { box-sizing: border-box; }
    #elena-dentist-mobile button, #elena-dentist-mobile a { -webkit-tap-highlight-color: transparent; }
    #elena-dentist-mobile button { font: inherit; }
    #elena-dentist-mobile a { color: inherit; text-decoration: none; }
    #elena-dentist-mobile h1, #elena-dentist-mobile h2, #elena-dentist-mobile h3, #elena-dentist-mobile p { margin-top: 0; }

    #elena-dentist-mobile .site-shell { margin: 0 auto; max-width: 1440px; }
    #elena-dentist-mobile .topbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(201, 232, 225, .75);
      background: rgba(245, 252, 250, .88);
      backdrop-filter: blur(16px);
    }

    #elena-dentist-mobile .wordmark { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #elena-dentist-mobile .wordmark-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px 12px 14px 14px;
      color: var(--white);
      background: linear-gradient(145deg, var(--mint-700), var(--mint-900));
      box-shadow: 0 7px 16px rgba(11, 110, 113, .18);
      font-size: 16px;
    }
    #elena-dentist-mobile .wordmark-copy { min-width: 0; }
    #elena-dentist-mobile .wordmark-kicker { display: block; color: var(--mint-900); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    #elena-dentist-mobile .wordmark-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; color: var(--ink); font-size: 13px; font-weight: 780; }

    #elena-dentist-mobile .language-switcher { display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); }
    #elena-dentist-mobile .language-button {
      min-width: 42px;
      min-height: 42px;
      border: 0;
      border-radius: 10px;
      color: var(--ink-soft);
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    #elena-dentist-mobile .language-button[aria-pressed="true"] { color: var(--white); background: var(--mint-900); }
    #elena-dentist-mobile .language-button:focus-visible, #elena-dentist-mobile .nav-link:focus-visible, #elena-dentist-mobile .routine-button:focus-visible, #elena-dentist-mobile .path-button:focus-visible { outline: 3px solid rgba(37, 185, 192, .48); outline-offset: 3px; }

    #elena-dentist-mobile .chapters { scroll-snap-type: y proximity; }
    #elena-dentist-mobile .chapter {
      position: relative;
      min-height: 100svh;
      padding: 40px 18px 48px;
      scroll-snap-align: start;
      container-type: inline-size;
    }
    #elena-dentist-mobile .chapter-inner { width: min(100%, 1140px); margin: 0 auto; }
    #elena-dentist-mobile .chapter--intro { display: grid; align-items: center; overflow: clip; background: radial-gradient(circle at 90% 8%, #c5f3eb 0 14%, transparent 37%), radial-gradient(circle at 18% 80%, #e6fbf7 0 9%, transparent 32%), var(--paper); }
    #elena-dentist-mobile .chapter--care { background: linear-gradient(180deg, #f9fffd 0%, #ecfbf6 100%); }
    #elena-dentist-mobile .chapter--visit { background: radial-gradient(circle at 100% 6%, #fff0dc 0 17%, transparent 36%), #fffdf9; }

    #elena-dentist-mobile .eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 13px; color: var(--mint-900); font-size: 11px; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
    #elena-dentist-mobile .eyebrow::before { width: 26px; height: 2px; content: ""; background: var(--aqua); }
    #elena-dentist-mobile h1, #elena-dentist-mobile h2 { color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-weight: 500; letter-spacing: -.045em; line-height: .98; }
    #elena-dentist-mobile h1 { max-width: 100%; margin-bottom: 18px; font-size: clamp(39px, 12vw, 84px); letter-spacing: -.055em; overflow-wrap: anywhere; text-wrap: balance; }
    #elena-dentist-mobile h2 { max-width: 670px; margin-bottom: 17px; font-size: clamp(38px, 11vw, 66px); }
    #elena-dentist-mobile .lead { max-width: 600px; color: var(--ink-soft); font-size: clamp(16px, 4.5vw, 20px); line-height: 1.58; }

    #elena-dentist-mobile .hero-grid { display: grid; gap: 23px; align-items: center; }
    #elena-dentist-mobile .hero-grid > *, #elena-dentist-mobile .section-grid > * { min-width: 0; }
    #elena-dentist-mobile .profile-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 23px; }
    #elena-dentist-mobile .profile-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--mint-900); background: rgba(255,255,255,.76); font-size: 13px; font-weight: 750; }
    #elena-dentist-mobile .profile-chip svg { width: 16px; height: 16px; }

    #elena-dentist-mobile .tooth-scene { position: relative; min-height: 342px; display: grid; place-items: center; isolation: isolate; }
    #elena-dentist-mobile .tooth-scene::before, #elena-dentist-mobile .tooth-scene::after { position: absolute; z-index: -1; content: ""; border-radius: 50%; }
    #elena-dentist-mobile .tooth-scene::before { width: min(88vw, 460px); aspect-ratio: 1; background: conic-gradient(from 140deg, #e7fbf7, #a8e9de, #ddf8f3, #e7fbf7); animation: elena-turn 15s linear infinite; }
    #elena-dentist-mobile .tooth-scene::after { width: min(72vw, 370px); aspect-ratio: 1; border: 1px dashed rgba(22,140,138,.5); }
    #elena-dentist-mobile .tooth-sculpture { width: min(238px, 61vw); filter: drop-shadow(0 25px 18px rgba(8, 81, 82, .18)); }
    #elena-dentist-mobile .floating-note { position: absolute; display: flex; align-items: center; gap: 7px; padding: 9px 11px; border: 1px solid rgba(255,255,255,.84); border-radius: 14px; color: var(--ink); background: rgba(255,255,255,.86); box-shadow: 0 11px 24px rgba(17,94,94,.12); font-size: 12px; font-weight: 780; backdrop-filter: blur(12px); }
    #elena-dentist-mobile .floating-note svg { width: 16px; height: 16px; color: var(--mint-900); }
    #elena-dentist-mobile .floating-note--city { top: 15%; left: 0; }
    #elena-dentist-mobile .floating-note--specialty { right: 0; bottom: 18%; }
    #elena-dentist-mobile .spark { position: absolute; border-radius: 50%; background: var(--peach); box-shadow: 0 0 0 8px rgba(255,176,139,.16); }
    #elena-dentist-mobile .spark--one { width: 10px; height: 10px; top: 19%; right: 14%; }
    #elena-dentist-mobile .spark--two { width: 6px; height: 6px; bottom: 10%; left: 13%; background: var(--sun); }

    #elena-dentist-mobile .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 25px; }
    #elena-dentist-mobile .fact { min-height: 111px; padding: 13px 11px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.68); }
    #elena-dentist-mobile .fact-number { display: block; color: var(--mint-900); font-family: Georgia, "Times New Roman", serif; font-size: 27px; line-height: 1; }
    #elena-dentist-mobile .fact-label { display: block; margin-top: 8px; color: var(--ink-soft); font-size: 12px; line-height: 1.3; }

    #elena-dentist-mobile .section-grid { display: grid; gap: 27px; align-items: center; }
    #elena-dentist-mobile .routine-panel { display: grid; gap: 18px; }
    #elena-dentist-mobile .routine-visual { position: relative; width: min(100%, 390px); aspect-ratio: 1; margin: 0 auto; display: grid; place-items: center; }
    #elena-dentist-mobile .routine-visual::before { position: absolute; inset: 4%; border: 1px solid rgba(22,140,138,.2); border-radius: 48% 52% 55% 45%; content: ""; transform: rotate(-12deg); }
    #elena-dentist-mobile .routine-ring { --ring-angle: 0deg; position: relative; width: 76%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(var(--mint-700) 0 42%, var(--aqua) 42% 68%, var(--peach) 68% 78%, #d4eee9 78% 100%); box-shadow: 0 18px 32px rgba(13,110,113,.12); }
    #elena-dentist-mobile .routine-ring::before { position: absolute; width: 72%; aspect-ratio: 1; border-radius: 50%; content: ""; background: var(--white); }
    #elena-dentist-mobile .routine-center { position: relative; text-align: center; }
    #elena-dentist-mobile .routine-center strong { display: block; color: var(--mint-900); font-family: Georgia, "Times New Roman", serif; font-size: clamp(42px, 12vw, 58px); font-weight: 500; line-height: .92; }
    #elena-dentist-mobile .routine-center span { display: block; margin-top: 7px; color: var(--ink-soft); font-size: 12px; font-weight: 750; }
    #elena-dentist-mobile .orbit-label { position: absolute; display: grid; place-items: center; width: 73px; height: 73px; padding: 8px; border: 1px solid rgba(255,255,255,.95); border-radius: 20px; color: var(--ink); background: var(--white); box-shadow: 0 12px 26px rgba(13,110,113,.1); text-align: center; font-size: 11px; font-weight: 800; line-height: 1.15; }
    #elena-dentist-mobile .orbit-label--one { top: 2%; left: 3%; }
    #elena-dentist-mobile .orbit-label--two { top: 13%; right: 0; }
    #elena-dentist-mobile .orbit-label--three { bottom: 1%; left: 8%; }
    #elena-dentist-mobile .orbit-label b { display: block; color: var(--mint-900); font-size: 16px; }

    #elena-dentist-mobile .routine-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    #elena-dentist-mobile .routine-button { min-height: 74px; padding: 8px; border: 1px solid var(--line); border-radius: 16px; color: var(--ink-soft); background: rgba(255,255,255,.72); font-size: 12px; font-weight: 760; line-height: 1.2; cursor: pointer; }
    #elena-dentist-mobile .routine-button[aria-pressed="true"] { border-color: var(--mint-700); color: var(--white); background: var(--mint-900); }
    #elena-dentist-mobile .routine-detail { min-height: 88px; margin: 0; padding: 17px; border-radius: 18px; color: var(--ink-soft); background: rgba(255,255,255,.7); font-size: 14px; line-height: 1.5; }
    #elena-dentist-mobile .routine-detail strong { color: var(--mint-900); }
    #elena-dentist-mobile .source-note { margin: 10px 0 0; color: var(--ink-soft); font-size: 11px; line-height: 1.45; }

    #elena-dentist-mobile .care-list { display: grid; gap: 11px; margin: 24px 0 0; padding: 0; list-style: none; }
    #elena-dentist-mobile .care-list li { position: relative; min-height: 60px; padding: 13px 13px 13px 54px; border-bottom: 1px solid var(--line); color: var(--ink); font-size: 15px; line-height: 1.45; }
    #elena-dentist-mobile .care-list li::before { position: absolute; top: 13px; left: 7px; width: 31px; height: 31px; display: grid; place-items: center; border-radius: 11px; color: var(--mint-900); background: var(--mint-100); content: "✦"; font-size: 14px; }

    #elena-dentist-mobile .visit-map { position: relative; display: grid; gap: 8px; padding: 18px 0; }
    #elena-dentist-mobile .visit-map::before { position: absolute; top: 45px; bottom: 45px; left: 22px; width: 2px; content: ""; background: linear-gradient(var(--peach), var(--sun), var(--mint-400)); }
    #elena-dentist-mobile .path-button { position: relative; min-height: 87px; display: grid; grid-template-columns: 46px 1fr; gap: 12px; align-items: center; padding: 12px 16px 12px 0; border: 0; border-radius: 18px; color: var(--ink); background: transparent; text-align: left; cursor: pointer; }
    #elena-dentist-mobile .path-button[aria-pressed="true"] { padding-left: 9px; background: rgba(255,255,255,.65); }
    #elena-dentist-mobile .path-number { width: 45px; height: 45px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 15px; color: var(--mint-900); background: var(--white); font-family: Georgia, "Times New Roman", serif; font-size: 20px; }
    #elena-dentist-mobile .path-copy strong { display: block; font-size: 15px; }
    #elena-dentist-mobile .path-copy span { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 13px; }
    #elena-dentist-mobile .path-detail { min-height: 71px; margin: 9px 0 0; padding: 16px; border: 1px solid #f2dfcd; border-radius: 18px; color: var(--ink-soft); background: #fff7ee; font-size: 14px; line-height: 1.48; }

    #elena-dentist-mobile .contact-card { padding: 20px; border: 1px solid #f0deca; border-radius: 24px; background: linear-gradient(135deg, #fff7ee, #fffdfa); }
    #elena-dentist-mobile .contact-card h3 { margin-bottom: 7px; color: var(--ink); font-size: 17px; }
    #elena-dentist-mobile .contact-main { display: block; margin-bottom: 7px; color: var(--mint-900); font-size: 15px; font-weight: 790; }
    #elena-dentist-mobile .contact-hint { margin-bottom: 0; color: var(--ink-soft); font-size: 13px; line-height: 1.45; }

    #elena-dentist-mobile .chapter-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 30px; }
    #elena-dentist-mobile .chapter-count { color: var(--ink-soft); font-size: 12px; font-weight: 750; letter-spacing: .08em; }
    #elena-dentist-mobile .next-link { min-height: 48px; display: inline-flex; align-items: center; gap: 9px; padding: 10px 15px; border: 1px solid var(--line); border-radius: 999px; color: var(--mint-900); background: rgba(255,255,255,.75); font-size: 13px; font-weight: 800; }
    #elena-dentist-mobile .next-link svg { width: 17px; height: 17px; }

    #elena-dentist-mobile .section-nav { display: flex; gap: 7px; margin: 0 18px 20px; padding: 6px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.74); }
    #elena-dentist-mobile .nav-link { min-width: 0; min-height: 45px; flex: 1; display: grid; place-items: center; padding: 8px; border-radius: 12px; color: var(--ink-soft); font-size: 11px; font-weight: 800; text-align: center; }
    #elena-dentist-mobile .nav-link.is-current { color: var(--white); background: var(--mint-900); }

    #elena-dentist-mobile .site-footer { padding: 0 18px 32px; color: var(--ink-soft); background: #fffdf9; font-size: 11px; text-align: center; }
    #elena-dentist-mobile .site-footer p { margin: 0; }

    @keyframes elena-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #elena-dentist-mobile *, #elena-dentist-mobile *::before, #elena-dentist-mobile *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    @media (any-pointer: coarse) { #elena-dentist-mobile .language-button { min-width: 46px; min-height: 46px; } #elena-dentist-mobile .routine-button { min-height: 80px; } }
    @media (max-width: 420px) {
      #elena-dentist-mobile .chapter { padding-inline: 16px; }
      #elena-dentist-mobile h1 { font-size: clamp(39px, 11.5vw, 48px); letter-spacing: -.065em; }
      #elena-dentist-mobile .facts { gap: 6px; }
      #elena-dentist-mobile .fact { padding-inline: 10px; }
    }
    @media (min-width: 760px) {
      #elena-dentist-mobile .topbar { padding: 14px clamp(34px, 6vw, 82px); }
      #elena-dentist-mobile .wordmark-name { max-width: none; }
      #elena-dentist-mobile .chapter { padding: 72px clamp(34px, 6vw, 82px); }
      #elena-dentist-mobile .hero-grid { grid-template-columns: minmax(0, 1fr) minmax(360px, .8fr); gap: clamp(34px, 7vw, 104px); }
      #elena-dentist-mobile .section-grid { grid-template-columns: minmax(0, 1fr) minmax(360px, .9fr); gap: clamp(38px, 8vw, 118px); }
      #elena-dentist-mobile .chapter--care .section-grid > :first-child { order: 2; }
      #elena-dentist-mobile .tooth-scene { min-height: 530px; }
      #elena-dentist-mobile .tooth-sculpture { width: min(315px, 60%); }
      #elena-dentist-mobile .floating-note--city { left: 2%; }
      #elena-dentist-mobile .facts { max-width: 620px; }
      #elena-dentist-mobile .section-nav { width: min(530px, calc(100% - 36px)); margin: 0 auto 25px; }
    }
    @container (min-width: 560px) { #elena-dentist-mobile .routine-controls { max-width: 430px; } }

    /* Narrow-screen and iPhone compatibility layer */
    #elena-dentist-mobile { overflow-x: hidden; overflow-x: clip; }
    #elena-dentist-mobile .topbar { -webkit-backdrop-filter: blur(16px); }
    #elena-dentist-mobile .chapter { min-height: 100vh; }
    @supports (min-height: 100svh) { #elena-dentist-mobile .chapter { min-height: 100svh; } }
    #elena-dentist-mobile .hero-grid > :first-child { position: relative; z-index: 2; }
    #elena-dentist-mobile .tooth-scene { z-index: 0; }
    @media (max-width: 759px) {
      #elena-dentist-mobile .tooth-scene { min-height: 275px; margin-top: 8px; }
      #elena-dentist-mobile .floating-note--city { left: max(0px, env(safe-area-inset-left)); }
      #elena-dentist-mobile .floating-note--specialty { right: max(0px, env(safe-area-inset-right)); }
    }
    @supports not (aspect-ratio: 1) {
      #elena-dentist-mobile .tooth-scene::before { height: min(88vw, 460px); }
      #elena-dentist-mobile .tooth-scene::after { height: min(72vw, 370px); }
      #elena-dentist-mobile .routine-visual { height: min(92vw, 390px); }
      #elena-dentist-mobile .routine-ring { height: 76%; }
    }
  </style>

  <div class="site-shell">
    <header class="topbar">
      <div class="wordmark">
        <span class="wordmark-mark" aria-hidden="true">✦</span>
        <span class="wordmark-copy"><span class="wordmark-kicker" id="brandKicker">Стоматология</span><span class="wordmark-name" id="brandName">Елена Заречинцева</span></span>
      </div>
      <div class="language-switcher" aria-label="Выбор языка">
        <button class="language-button" type="button" data-language="ru" aria-pressed="true">RU</button>
        <button class="language-button" type="button" data-language="en" aria-pressed="false">EN</button>
        <button class="language-button" type="button" data-language="pl" aria-pressed="false">PL</button>
      </div>
    </header>

    <nav class="section-nav" id="sectionNav" aria-label="Разделы презентации">
      <a class="nav-link is-current" data-section-link="intro" href="#intro">О враче</a>
      <a class="nav-link" data-section-link="care" href="#care">Уход</a>
      <a class="nav-link" data-section-link="visit" href="#visit">Визит</a>
    </nav>

    <main class="chapters">
      <section class="chapter chapter--intro" id="intro" aria-labelledby="introTitle">
        <div class="chapter-inner hero-grid">
          <div>
            <p class="eyebrow" id="introEyebrow">О враче</p>
            <h1 id="introTitle">Елена<br>Заречинцева</h1>
            <p class="lead" id="introText"></p>
            <div class="profile-chip-row">
              <span class="profile-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-5.1 7-12A7 7 0 0 0 5 9c0 6.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/></svg><span id="cityChip">Бобруйск</span></span>
              <span class="profile-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/></svg><span id="specialtyChip">Стоматолог-ортопед</span></span>
            </div>
            <div class="facts" id="facts"></div>
          </div>
          <div class="tooth-scene" aria-label="Декоративная графика зуба">
            <span class="floating-note floating-note--city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-5.1 7-12A7 7 0 0 0 5 9c0 6.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/></svg><span id="graphicCity">Бобруйск</span></span>
            <svg class="tooth-sculpture" viewBox="0 0 420 500" role="img" aria-label="Иллюстрация зуба">
              <path d="M210 48C129 48 79 94 83 173c4 71 47 114 56 178 8 60 12 103 49 103 19 0 24-22 26-45l4-58c1-17 7-26 20-26s19 9 20 26l4 58c2 23 7 45 26 45 37 0 41-43 49-103 9-64 52-107 56-178 4-79-46-125-127-125-19 0-38 5-56 14-18-9-37-14-56-14Z" fill="#fffefa" stroke="#0b6e71" stroke-width="7" stroke-linejoin="round"/>
              <path d="M130 158c10-45 42-72 80-77" fill="none" stroke="#e4f8f3" stroke-width="26" stroke-linecap="round"/>
              <path d="M275 93l5 22 22 5-22 5-5 22-5-22-22-5 22-5 5-22Z" fill="#ffb08b"/>

      // ========================= EDITABLE COPY END ==========================

      const root = document.getElementById("elena-dentist-mobile");
      const languageButtons = Array.from(root.querySelectorAll("[data-language]"));
      const routineButtons = Array.from(root.querySelectorAll("[data-routine]"));
      const pathButtons = Array.from(root.querySelectorAll("[data-path]"));
      const sectionLinks = Array.from(root.querySelectorAll("[data-section-link]"));
      const chapters = Array.from(root.querySelectorAll(".chapter"));
      let language = "ru";
      let routine = "brush";
      let path = "question";

      const setText = (selector, text) => { root.querySelector(selector).textContent = text; };
      const setHTML = (selector, html) => { root.querySelector(selector).innerHTML = html; };
      const setTwoLineTitle = (selector, name) => {
        const title = root.querySelector(selector);
        const words = name.split(" ");
        const firstLine = document.createTextNode(words.shift() || "");
        const secondLine = document.createTextNode(words.join(" "));
        title.replaceChildren(firstLine, document.createElement("br"), secondLine);
      };

      function renderFacts(items) {
        const container = root.querySelector("#facts");
        container.replaceChildren(...items.map((item) => {
          const fact = document.createElement("div");
          fact.className = "fact";
          const number = document.createElement("span");
          number.className = "fact-number";
          number.textContent = item.number;
          const label = document.createElement("span");
          label.className = "fact-label";
          label.innerHTML = item.label.replace("\n", "<br>");
          fact.append(number, label);
          return fact;
        }));
      }

      function renderList(items) {
        const list = root.querySelector("#careList");
        list.replaceChildren(...items.map((item) => { const line = document.createElement("li"); line.textContent = item; return line; }));
      }

      function renderRoutine() {
        const t = copy[language].routine;
        setText("#routineMain", t.main); setText("#routineCaption", t.caption);
        setText("#orbitOneValue", "2×"); setText("#orbitOneText", t.one);
        setText("#orbitTwoValue", "≈2"); setText("#orbitTwoText", t.two);
        setText("#orbitThreeValue", "+"); setText("#orbitThreeText", t.three);
        routineButtons.forEach((button) => { const key = button.dataset.routine; button.textContent = t.buttons[key]; button.setAttribute("aria-pressed", String(key === routine)); });
        setHTML("#routineDetail", t.details[routine]);
      }

      function renderPath() {
        const t = copy[language].path;
        [["question", "One"], ["review", "Two"], ["plan", "Three"]].forEach(([key, suffix]) => {
          setText(`#path${suffix}Title`, t[key].title); setText(`#path${suffix}Text`, t[key].text);
        });
        pathButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.path === path)));
        setText("#pathDetail", t[path].detail);
      }

      function renderLanguage() {
        const t = copy[language];
        root.lang = language;
        document.title = `${t.name} — ${t.specialty}`;
        setText("#brandKicker", t.brandKicker); setText("#brandName", t.name);
        setText("#introEyebrow", t.introEyebrow); setTwoLineTitle("#introTitle", t.name); setText("#introText", t.intro);
        setText("#cityChip", t.city); setText("#specialtyChip", t.specialty); setText("#graphicCity", t.city); setText("#graphicSpecialty", t.graphicSpecialty);
        renderFacts(t.facts); sectionLinks.forEach((link, index) => { link.textContent = t.nav[index]; });
        setText("#nextToCare", t.nextToCare); setText("#nextToVisit", t.nextToVisit); setText("#backToStart", t.backToStart);
        setText("#careEyebrow", t.careEyebrow); setText("#careTitle", t.careTitle); setText("#careLead", t.careLead); renderList(t.careItems); setText("#sourceNote", t.sourceNote);
        renderRoutine(); setText("#visitEyebrow", t.visitEyebrow); setText("#visitTitle", t.visitTitle); setText("#visitLead", t.visitLead); renderPath();
        setText("#contactEyebrow", t.contactEyebrow); setText("#contactTitle", t.contactTitle); setText("#contactMain", t.contactMain); setText("#contactHint", t.contactHint); setText("#footerNote", t.footer);
        languageButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.language === language)));
      }

      function transition(update) {
        if (document.startViewTransition) { document.startViewTransition(update); } else { update(); }
      }

      languageButtons.forEach((button) => button.addEventListener("click", () => { language = button.dataset.language; transition(renderLanguage); }));
      routineButtons.forEach((button) => button.addEventListener("click", () => { routine = button.dataset.routine; renderRoutine(); }));
      pathButtons.forEach((button) => button.addEventListener("click", () => { path = button.dataset.path; renderPath(); }));
      sectionLinks.forEach((link) => link.addEventListener("click", (event) => {
        event.preventDefault();
        root.querySelector(link.getAttribute("href")).scrollIntoView({ behavior: "smooth", block: "start" });
      }));
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          sectionLinks.forEach((link) => link.classList.toggle("is-current", link.dataset.sectionLink === entry.target.id));
        }), { threshold: .58 });
        chapters.forEach((chapter) => observer.observe(chapter));
      }
      renderLanguage();
    })();
